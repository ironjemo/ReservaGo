services:

  postgres:
    image: postgres:16

    container_name: reservago_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - reservago_postgres_data:/var/lib/postgresql/data

    networks:
      - reservago_network

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: reservago_pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - reservago_pgadmin_data:/var/lib/pgadmin

    networks:
      - reservago_network

volumes:

  reservago_postgres_data:

  reservago_pgadmin_data:

networks:

  reservago_network:
    driver: bridge